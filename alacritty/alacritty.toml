[colors.primary]
background = "#161616"
foreground = "#d6d2cc"
bright_foreground = "#efece7"
dim_foreground = "#8f8c88"

[colors.cursor]
cursor = "#e05d3a"
text = "#161616"

[colors.selection]
background = "#3a3835"
text = "#efece7"

[colors.normal]
black = "#222222"
red = "#d96a4d"
green = "#9aab84"
yellow = "#cfae7a"
blue = "#8aa0b4"
magenta = "#b193a8"
cyan = "#8fafa8"
white = "#b5b1ab"

[colors.bright]
black = "#5f5c58"
red = "#e8886e"
green = "#b3c39d"
yellow = "#e0c493"
blue = "#a4b9cc"
magenta = "#c8adc0"
cyan = "#a8c7c0"
white = "#efece7"

[window]
decorations = "none"
padding = { x = 3, y = 3 }
#opacity = 0.9

[window.dimensions]
columns = 180
lines = 50

[font]
normal = { family = "FiraCode Nerd Font", style = "Retina" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Retina Italic" }
bold_italic = { family = "FiraCode Nerd Font", style = "Bold Italic" }
size = 13.0
