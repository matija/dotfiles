thm_base="#161616"
thm_surface="#1d1d1d"
thm_overlay="#363635"
thm_muted="#706e6b"
thm_subtle="#8f8c88"
thm_text="#d6d2cc"
thm_love="#d96a4d"
thm_gold="#cfae7a"
thm_rose="#b193a8"
thm_pine="#8aa0b4"
thm_foam="#8fafa8"
thm_iris="#b193a8"
thm_hl_low="#262626"
thm_hl_med="#3a3835"
thm_hl_high="#494844"

color_tx_1=$thm_text
color_tx_2=$thm_subtle
color_tx_3=$thm_muted
color_bg_1=$thm_base
color_bg_2=$thm_surface
color_ui_1=$thm_overlay
color_ui_2=$thm_hl_med
color_ui_3=$thm_hl_high

color_red=$thm_love
color_orange=$thm_gold
color_yellow=$thm_gold
color_green="#9aab84"
color_cyan=$thm_foam
color_blue=$thm_pine
color_purple=$thm_iris
color_magenta=$thm_rose

# status
set -g status "on"
set -g status-bg $color_bg_2
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# messages
set -g message-style "fg=$color_tx_1,bg=$color_bg_2,align=centre"
set -g message-command-style "fg=$color_tx_1,bg=$color_ui_2,align=centre"

# panes
set -g pane-border-style fg=$color_ui_2
set -g pane-active-border-style fg=$color_blue

# windows
setw -g window-status-activity-style fg=$color_tx_1,bg=$color_bg_1,none
setw -g window-status-separator ""
setw -g window-status-style fg=$color_tx_1,bg=$color_bg_1,none

# statusline
set -g status-left "#{?client_prefix,#[fg=$color_bg_1,bg=$color_red],#[fg=$color_bg_1,bg=$color_green]}  #S "
set -g status-right "#[fg=$color_bg_1,bg=$color_orange]  #{b:pane_current_path} #[fg=$color_bg_1,bg=$color_purple]  %Y-%m-%d %I:%M %p "

# window-status
setw -g window-status-format "#[bg=$color_bg_2,fg=$color_tx_2] #I  #W "
setw -g window-status-current-format "#[bg=$color_bg_1,fg=$color_tx_1] #I  #W "

# Modes
setw -g clock-mode-colour $color_blue
#setw -g clock-mode-style 1
setw -g mode-style fg=$color_orange,bg=$color_tx_1,bold
set -g extended-keys on
set -g extended-keys-format csi-u

set -g mouse on

# Pass window titles to terminal (Moshi displays these)
set -g set-titles on
# Now it shows 1: Fixing auth... (your window title in tmux)
set -g set-titles-string "#I: #T"

# Start window numbering at 1 (Moshi displays from 1)
set -g base-index 1
setw -g pane-base-index 1
