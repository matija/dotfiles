# Polar Aurora — Herdr theme block
# To use this theme, replace the [theme] and [theme.custom] sections in
# ~/.config/herdr/config.toml with the block below, then run:
#   herdr server reload-config

[theme]
# No built-in "polar-aurora"; use a neutral dark base and override every token below.
name = "one-dark"

[theme.custom]
panel_bg      = "#181818"  # background
sidebar_bg    = "#121212"  # toolPendingBg
active_row_bg = "#282828"  # userMsgBg
selection_bg  = "#383838"  # the Polar Aurora selection colour
surface0      = "#202020"  # toolSuccessBg
surface1      = "#303030"  # darkGray
surface_dim   = "#121212"  # toolPendingBg
overlay0      = "#666666"  # dimGray
overlay1      = "#777777"  # gray
text          = "#dedede"  # foreground
subtext0      = "#777777"  # gray
accent        = "#92eebb"  # accent
red           = "#de7d8c"
green         = "#7bdca9"
yellow        = "#e2c676"
blue          = "#71a3e0"
teal          = "#71cfd5"  # cyan
peach         = "#e5a178"  # syntaxNumber
mauve         = "#a28ae7"  # magenta
