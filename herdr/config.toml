onboarding = false

[theme]
# No built-in "nightowl"; use a neutral dark base and override every token below.
name = "one-dark"

[theme.custom]
panel_bg      = "#011627"  # background
sidebar_bg    = "#01111d"  # toolPendingBg
active_row_bg = "#0b2942"  # userMsgBg
selection_bg  = "#1d3b53"  # thinkingLow, the Night Owl selection colour
surface0      = "#0b253a"  # toolSuccessBg
surface1      = "#122d42"  # darkGray
surface_dim   = "#01111d"  # toolPendingBg
overlay0      = "#4b6479"  # dimGray
overlay1      = "#5f7e97"  # gray
text          = "#d6deeb"  # foreground
subtext0      = "#5f7e97"  # gray
accent        = "#80CBC4"  # accent
red           = "#EF5350"
green         = "#c5e478"
yellow        = "#ffcb8b"
blue          = "#82AAFF"
teal          = "#7fdbca"  # cyan
peach         = "#F78C6C"  # syntaxNumber
mauve         = "#c792ea"  # magenta

[ui]
show_agent_labels_on_pane_borders = true
accent = "#80CBC4"
# tmux drew single-line dividers between adjacent panes
pane_gaps = false

# kill-window and kill-session never asked
confirm_close = false
# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false
# set -g mouse on
mouse_capture = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "herdr"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+b"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"
# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"
# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Sessions -> workspaces
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Resize by ~5 columns/rows, like resize-pane -L 5 on C-M-S-arrows
[[keys.command]]
key = "ctrl+alt+shift+left"
type = "shell"
command = "herdr pane resize --current --direction left --amount 0.03"

[[keys.command]]
key = "ctrl+alt+shift+down"
type = "shell"
command = "herdr pane resize --current --direction down --amount 0.03"

[[keys.command]]
key = "ctrl+alt+shift+up"
type = "shell"
command = "herdr pane resize --current --direction up --amount 0.03"

[[keys.command]]
key = "ctrl+alt+shift+right"
type = "shell"
command = "herdr pane resize --current --direction right --amount 0.03"

